name: Build & Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/docker-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kms-connect-backend

jobs:
  test:
    name: Django check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: '1'

  build-and-deploy:
    name: Build image & deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compute image name
        id: img
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${OWNER}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          SSH_KEY_B64: ${{ secrets.DO_SSH_PRIVATE_KEY_B64 }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$SSH_KEY_B64" ]; then
            echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          else
            printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key

      - run: ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes"
          GHCR_USER_LC="$(echo "$GHCR_USER" | tr '[:upper:]' '[:lower:]')"
          ssh $SSH_OPTS -p ${{ secrets.DO_SSH_PORT }} ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} \
            "PROJECT_PATH='${{ secrets.DO_PROJECT_PATH }}' APP_IMAGE='$APP_IMAGE' REGISTRY='$REGISTRY' GHCR_USER='$GHCR_USER_LC' GHCR_TOKEN='$GHCR_TOKEN' bash -s" << 'EOF'
          set -euo pipefail
          cd "$PROJECT_PATH"
          echo "Deploy path: $(pwd)"
          echo "Target image: $APP_IMAGE"
          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          else
            DOCKER=(sudo docker)
            echo "Using sudo for Docker commands"
          fi
          echo "$GHCR_TOKEN" | "${DOCKER[@]}" login "$REGISTRY" -u "$GHCR_USER" --password-stdin
          GIT_ROOT="$PROJECT_PATH"
          if [ -d "$(dirname "$PROJECT_PATH")/.git" ]; then
            GIT_ROOT="$(dirname "$PROJECT_PATH")"
          fi
          BEFORE_HEAD="$(git -C "$GIT_ROOT" rev-parse HEAD 2>/dev/null || true)"
          git -C "$GIT_ROOT" pull origin main
          AFTER_HEAD="$(git -C "$GIT_ROOT" rev-parse HEAD 2>/dev/null || true)"
          CHANGED_FILES="$(git -C "$GIT_ROOT" diff --name-only "$BEFORE_HEAD" "$AFTER_HEAD" 2>/dev/null || true)"
          chmod +x deploy/*.sh deploy/lib/*.sh entrypoint.sh 2>/dev/null || true
          export APP_IMAGE CHANGED_FILES
          AUTO_DEPLOY=true SKIP_PULL_CODE=true bash deploy/deploy-registry.sh
          "${DOCKER[@]}" logout "$REGISTRY" || true
          EOF

      - name: Verify deployment health
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=yes"
          ssh $SSH_OPTS -p ${{ secrets.DO_SSH_PORT }} ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} \
            "PROJECT_PATH='${{ secrets.DO_PROJECT_PATH }}' bash -s" << 'EOF'
          set -euo pipefail
          cd "$PROJECT_PATH"
          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          else
            DOCKER=(sudo docker)
          fi
          for i in $(seq 1 6); do
            if "${DOCKER[@]}" compose --env-file .env -f docker-compose.prod.yml exec -T api \
              curl -fsS --max-time 5 -H "X-Forwarded-Proto: https" "http://localhost:8000/health/" 2>/dev/null \
              | grep -qE '"success"[[:space:]]*:[[:space:]]*true|"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          exit 1
          EOF
